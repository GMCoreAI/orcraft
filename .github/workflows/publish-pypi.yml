name: Publish to PyPI

# The one road from this repository to PyPI. When a release is published here,
# its attached wheels are uploaded with trusted publishing: no API token exists
# anywhere, PyPI trusts this workflow's identity (repository, file name and the
# environment below), and it records attestations so a download can be verified
# against the release. Releases here are created by GM Core's release process,
# by a person, with a version; nothing else runs this workflow.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist
          ls -l dist
          test -n "$(ls dist/*.whl)"

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
