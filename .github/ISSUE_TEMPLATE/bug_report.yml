name: Bug report
description: Something in Orcraft does not behave as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Orcraft version
      description: From the controller's About dialog, or `pip show orcraft`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Quote the exact message when there is one.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version of the controller and of the endpoint machines involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of the controller or endpoint log. Remove anything private before pasting; this issue is public.
      render: text
