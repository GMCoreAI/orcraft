name: Feature request
description: Something you want Orcraft to do.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The test, the lab or the workflow this is for, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, or what stops you.
